<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>NYVEX</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0b0b;color:#f2f2f2}
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:#0b0b0b}
    main{width:min(100%,420px);text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 24px;border:1px solid #444;border-radius:18px;display:grid;place-items:center;background:#191919;font-size:26px}
    h1{margin:0;font-size:29px;letter-spacing:-.05em}
    p{margin:12px auto 24px;max-width:320px;color:#999;font-size:14px;line-height:1.7}
    a{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;background:#eee;color:#111;text-decoration:none;font-size:13px;font-weight:650}
    small{display:block;margin-top:20px;color:#686868;font-size:11px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <h1>NYVEX</h1>
    <p>Reconnect to the internet to open your AI workspace, conversations, and voice features.</p>
    <a href="https://nyvex-kati.onrender.com/">Open NYVEX <span aria-hidden="true">↗</span></a>
    <small>AI workspace · Dreams into reality</small>
  </main>
</body>
</html>
